name: Kameleon CI Base Check

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          echo "Checking infrastructure setup..."
          test -f infrastructure/compose.yaml
          echo "Infrastructure setup verified successfully!"

