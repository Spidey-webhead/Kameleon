services:
  # silnik gry (Python / FastAPI)
  game-service:
    build:
      context: ../game-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  # backend (Spring Boot)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped

  # frontend (React)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped

